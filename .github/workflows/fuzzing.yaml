name: fuzzing
on:
  # Triggered manually and once a week, so the fuzz targets don't rot.
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
jobs:
  run-fuzzing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run fuzz tests
        run: make fuzz
