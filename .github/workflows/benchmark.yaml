# Benchmarks are indicative only: GitHub-hosted runner performance is noisy and
# changes between runner images, so treat the results as a trend to look back at
# rather than a stable performance gate.
name: benchmark
on:
  # Triggered manually and once a week, so the benchmarks don't rot.
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run benchmark
        run: make bench
